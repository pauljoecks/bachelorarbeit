<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}preparation{% endblock %}</title>
    <link rel="stylesheet" href="/styles.css" />
    {% if active_page == "generate" %}
    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
    </script>
    {% endif %}
  </head>
  <body>
    <header class="nav">
      <nav class="nav-bar" aria-label="Main navigation">
        <div class="nav-links">
          <a
            href="/generate"
            class="nav-link{% if active_page == 'generate' %} active{% endif %}"
            {% if active_page == 'generate' %}aria-current="page"{% endif %}
            >Generate</a
          >
          <a
            href="/select"
            class="nav-link{% if active_page == 'select' %} active{% endif %}"
            {% if active_page == 'select' %}aria-current="page"{% endif %}
            >Select</a
          >
          <a
            href="/view"
            class="nav-link{% if active_page == 'view' %} active{% endif %}"
            {% if active_page == 'view' %}aria-current="page"{% endif %}
            >View</a
          >
        </div>
        <div class="nav-id">
          <div class="field-input-shell field-input-shell-id">
            <input
              type="text"
              id="welding-id"
              class="field-input field-input-id"
              maxlength="3"
              inputmode="text"
              placeholder=" "
              autocapitalize="characters"
              autocomplete="off"
              spellcheck="false"
              aria-label="ID"
            />
            <span class="field-input-hint" aria-hidden="true">ID</span>
          </div>
        </div>
        <div class="nav-excel">
          <div class="nav-excel-path">
            <input
              type="text"
              id="versuchs-path"
              class="nav-excel-input"
              value="{{ data_path }}"
              placeholder="Pfad zum data-Ordner"
              spellcheck="false"
              autocomplete="off"
              role="combobox"
              aria-expanded="false"
              aria-controls="data-path-suggestions"
              aria-autocomplete="list"
              aria-label="Data-Ordner"
            />
            <button
              type="button"
              id="data-path-toggle"
              class="nav-excel-path-toggle"
              aria-label="Pfadvorschläge anzeigen"
              aria-controls="data-path-suggestions"
              aria-expanded="false"
              tabindex="-1"
            >
              ▾
            </button>
            <ul
              id="data-path-suggestions"
              class="nav-excel-suggestions"
              role="listbox"
              hidden
            >
              {% for suggestion in data_path_suggestions %}
              <li role="option" tabindex="-1" data-value="{{ suggestion }}">{{ suggestion }}</li>
              {% endfor %}
            </ul>
          </div>
          <button type="button" id="load-excel" class="nav-excel-button">
            Laden
          </button>
          <span id="load-status" class="load-status {{ load_status.type }}" aria-live="polite"
            >{{ load_status.message }}</span
          >
        </div>
      </nav>
    </header>
    <script>
      (function () {
        const menuLink = document.querySelector('.nav-link[href="/generate"]');
        const savedFilter = localStorage.getItem("menu-filter");
        if (menuLink && savedFilter) {
          const params = new URLSearchParams({ filter: savedFilter });
          menuLink.href = `/generate?${params.toString()}`;
        }
      })();
    </script>
    <script>
      (function () {
        const idInput = document.getElementById("welding-id");
        const ID_STORAGE_KEY = "experiment-id";

        function normalizeExperimentId(value) {
          return String(value).replace(/[^A-Za-z]/g, "").toUpperCase().slice(0, 3);
        }

        function dispatchIdChange() {
          if (!idInput) {
            return;
          }

          idInput.dispatchEvent(
            new CustomEvent("id-change", {
              detail: { id: idInput.value },
            })
          );
        }

        function updateIdFieldState() {
          if (!idInput) {
            return;
          }

          idInput
            .closest(".field-input-shell-id")
            ?.classList.toggle("has-value", idInput.value.length > 0);
        }

        window.setExperimentId = function (id) {
          if (!idInput) {
            return;
          }

          idInput.value = normalizeExperimentId(id);
          localStorage.setItem(ID_STORAGE_KEY, idInput.value);
          updateIdFieldState();
          dispatchIdChange();
        };

        function syncIdField() {
          if (!idInput) {
            return;
          }

          const normalized = normalizeExperimentId(idInput.value);
          if (idInput.value !== normalized) {
            idInput.value = normalized;
          }

          localStorage.setItem(ID_STORAGE_KEY, idInput.value);
          updateIdFieldState();
          dispatchIdChange();
        }

        if (idInput) {
          idInput.addEventListener("focus", () => {
            idInput.select();
          });

          idInput.addEventListener("input", syncIdField);

          idInput.addEventListener("paste", (event) => {
            event.preventDefault();
            const pasted = (event.clipboardData || window.clipboardData).getData("text");
            idInput.value = normalizeExperimentId(pasted);
            syncIdField();
          });

          const savedId = localStorage.getItem(ID_STORAGE_KEY);
          if (savedId) {
            window.setExperimentId(savedId);
          } else {
            updateIdFieldState();
          }
        }
      })();
    </script>
    <main class="app">{% block content %}{% endblock %}</main>
    <script>
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") {
          return;
        }

        const target = event.target;
        if (!(target instanceof HTMLInputElement)) {
          return;
        }

        // Data-Pfad: Enter löst Laden aus (eigener Handler), nicht nur Blur.
        if (target.id === "versuchs-path") {
          return;
        }

        const blurOnEnterTypes = new Set(["text", "search", "url", "email", "tel"]);
        if (!blurOnEnterTypes.has(target.type)) {
          return;
        }

        event.preventDefault();
        target.blur();
      });
    </script>
    <script>
      (function () {
        // IIFE: vermeidet Kollision mit page-local const statusEl / setStatus
        // (welding.html, scanning.html), sonst stirbt dieser Block still.
        const pathInput = document.getElementById("versuchs-path");
        const loadBtn = document.getElementById("load-excel");
        const loadStatusEl = document.getElementById("load-status");
        const pathToggle = document.getElementById("data-path-toggle");
        const suggestionsList = document.getElementById("data-path-suggestions");
        const LOAD_TIMEOUT_MS = 60000;
        const LOAD_BTN_LABEL = loadBtn ? loadBtn.textContent : "Laden";

        function setLoadStatus(message, type = "idle") {
          if (!loadStatusEl) {
            return;
          }

          loadStatusEl.textContent = message;
          loadStatusEl.className = type ? `load-status ${type}` : "load-status";
        }

        function setSuggestionsOpen(open) {
          if (!suggestionsList || !pathInput) {
            return;
          }

          suggestionsList.hidden = !open;
          pathInput.setAttribute("aria-expanded", open ? "true" : "false");
          pathToggle?.setAttribute("aria-expanded", open ? "true" : "false");

          if (open) {
            const current = pathInput.value.trim();
            suggestionsList.querySelectorAll('[role="option"]').forEach((option) => {
              option.setAttribute(
                "aria-selected",
                option.dataset.value === current ? "true" : "false"
              );
            });
          }
        }

        function chooseSuggestion(value) {
          if (!pathInput || !value) {
            return;
          }

          pathInput.value = value;
          setSuggestionsOpen(false);
          pathInput.focus();
        }

        if (pathInput && suggestionsList) {
          pathToggle?.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            setSuggestionsOpen(suggestionsList.hidden);
            if (!suggestionsList.hidden) {
              pathInput.focus();
            }
          });

          pathInput.addEventListener("click", () => {
            setSuggestionsOpen(true);
          });

          suggestionsList.querySelectorAll('[role="option"]').forEach((option) => {
            option.addEventListener("mousedown", (event) => {
              event.preventDefault();
              chooseSuggestion(option.dataset.value);
            });
          });

          document.addEventListener("click", (event) => {
            const pathShell = pathInput.closest(".nav-excel-path");
            if (pathShell && !pathShell.contains(event.target)) {
              setSuggestionsOpen(false);
            }
          });
        }

        if (!pathInput || !loadBtn) {
          return;
        }

        let loadInProgress = false;

        const triggerLoad = async () => {
          if (loadInProgress) {
            setLoadStatus("Laden läuft bereits…", "loading");
            return;
          }

          const path = pathInput.value.trim();

          if (!path) {
            setLoadStatus("Bitte einen Pfad angeben.", "error");
            return;
          }

          setSuggestionsOpen(false);
          loadInProgress = true;
          setLoadStatus(`Lädt ${path}…`, "loading");
          loadBtn.disabled = true;
          loadBtn.textContent = "Lädt…";

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), LOAD_TIMEOUT_MS);

          try {
            const response = await fetch("/api/load-versuchsuebersicht", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ path }),
              signal: controller.signal,
            });
            const data = await response.json();

            if (!response.ok) {
              setLoadStatus(data.error || "Fehler beim Laden.", "error");
              return;
            }

            pathInput.value = data.data_path || path;
            setLoadStatus(`${data.row_count} Zeilen geladen aus ${data.data_path}.`, "success");
            window.location.reload();
            return;
          } catch (error) {
            if (error && error.name === "AbortError") {
              setLoadStatus(
                "Zeitüberschreitung beim Laden. Server neu starten und erneut versuchen.",
                "error"
              );
            } else {
              setLoadStatus("Verbindungsfehler. Läuft der Server noch?", "error");
            }
          } finally {
            clearTimeout(timeoutId);
            loadInProgress = false;
            loadBtn.disabled = false;
            loadBtn.textContent = LOAD_BTN_LABEL;
          }
        };

        loadBtn.addEventListener("click", (event) => {
          event.preventDefault();
          triggerLoad();
        });

        pathInput.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            setSuggestionsOpen(false);
            return;
          }

          if (event.key === "ArrowDown") {
            event.preventDefault();
            setSuggestionsOpen(true);
            return;
          }

          if (event.key === "Enter") {
            event.preventDefault();
            event.stopPropagation();
            triggerLoad();
          }
        });
      })();
    </script>
    {% if active_page == "generate" %}
    <script>
      (function () {
        const MENU_SCROLL_KEY = "menu-scroll-y";
        const FILTER_STORAGE_KEY = "menu-filter";

        function isMenuPath() {
          return window.location.pathname === "/generate";
        }

        function saveMenuScrollPosition() {
          sessionStorage.setItem(MENU_SCROLL_KEY, String(window.scrollY));
        }

        function restoreMenuScrollPosition() {
          const savedScroll = sessionStorage.getItem(MENU_SCROLL_KEY);
          if (savedScroll === null) {
            return;
          }

          const scrollY = Number.parseFloat(savedScroll);
          if (!Number.isFinite(scrollY) || scrollY <= 0) {
            return;
          }

          let attempts = 0;

          function applyScroll() {
            window.scrollTo(0, scrollY);
            document.documentElement.scrollTop = scrollY;
            document.body.scrollTop = scrollY;
            attempts += 1;

            if (Math.abs(window.scrollY - scrollY) > 2 && attempts < 40) {
              requestAnimationFrame(applyScroll);
            }
          }

          applyScroll();
        }

        function shouldRestoreAfterFilterRedirect() {
          const params = new URLSearchParams(window.location.search);
          const savedFilter = localStorage.getItem(FILTER_STORAGE_KEY);
          return !( !params.has("filter") && savedFilter );
        }

        let scrollSaveTimer;
        window.addEventListener(
          "scroll",
          () => {
            clearTimeout(scrollSaveTimer);
            scrollSaveTimer = setTimeout(saveMenuScrollPosition, 50);
          },
          { passive: true }
        );

        window.addEventListener("pagehide", saveMenuScrollPosition);

        document.querySelectorAll(".nav-link").forEach((link) => {
          const saveIfOnMenu = () => {
            if (isMenuPath()) {
              saveMenuScrollPosition();
            }
          };

          link.addEventListener("mousedown", saveIfOnMenu);
          link.addEventListener("click", saveIfOnMenu);
        });

        function scheduleRestore() {
          if (!shouldRestoreAfterFilterRedirect()) {
            return;
          }

          restoreMenuScrollPosition();
          window.addEventListener("load", restoreMenuScrollPosition, { once: true });
          window.addEventListener(
            "pageshow",
            (event) => {
              if (event.persisted) {
                restoreMenuScrollPosition();
              }
            }
          );
          setTimeout(restoreMenuScrollPosition, 0);
          setTimeout(restoreMenuScrollPosition, 100);
          setTimeout(restoreMenuScrollPosition, 300);
        }

        scheduleRestore();
      })();
    </script>
    {% endif %}
    <script>
      (function () {
        const layout = document.querySelector(".analyzing-layout");
        const nav = document.querySelector(".nav");
        if (!layout) {
          return;
        }

        const STICKY_SELECTOR =
          ".analyzing-sidebar, .analyzing-characteristics-sidebar, .analyzing-weld-controls-sidebar, .analyzing-scan-controls-sidebar, .analyzing-correlate-controls-sidebar, .analyzing-graphs-panel";
        const STICKY_EDGE_GAP = 12;
        const RESIZE_DEBOUNCE_MS = 120;

        let lastScrollY = window.scrollY;
        let navOffset = nav ? Math.ceil(nav.getBoundingClientRect().height) : 0;
        let stickyColumns = [];
        let scrollTicking = false;
        let layoutTickTimer = 0;
        const shiftByColumn = new WeakMap();

        function isStickyColumn(column) {
          if (
            column.matches(".analyzing-view-controls-stack > aside[data-view-panel]") &&
            !column.classList.contains("is-active")
          ) {
            return false;
          }
          return true;
        }

        function refreshStickyColumns() {
          stickyColumns = Array.from(layout.querySelectorAll(STICKY_SELECTOR)).filter(isStickyColumn);
        }

        function refreshNavOffset() {
          navOffset = nav ? Math.ceil(nav.getBoundingClientRect().height) : 0;
          document.documentElement.style.setProperty(
            "--analyzing-nav-stick-top",
            `${navOffset + STICKY_EDGE_GAP}px`,
          );
          document.documentElement.style.setProperty(
            "--analyzing-nav-stick-bottom",
            `${STICKY_EDGE_GAP}px`,
          );
        }

        function getColumnShift(column) {
          return shiftByColumn.get(column) ?? 0;
        }

        function setColumnShift(column, value) {
          shiftByColumn.set(column, value);
        }

        function getTopStick() {
          return navOffset + STICKY_EDGE_GAP;
        }

        function clampShift(value, topStick, columnHeight, viewportHeight) {
          const minShift = Math.min(
            0,
            viewportHeight - STICKY_EDGE_GAP - columnHeight - topStick,
          );
          return Math.max(minShift, Math.min(0, value));
        }

        function fitsInViewport(columnHeight, viewportHeight) {
          return columnHeight <= viewportHeight - navOffset - 2 * STICKY_EDGE_GAP;
        }

        function setColumnTop(column, topStick, shiftY) {
          column.style.setProperty(
            "--analyzing-sticky-top",
            `${Math.round(topStick + shiftY)}px`,
          );
        }

        function applyColumnShift(column, viewportHeight, { resyncFromDom = false } = {}) {
          const columnHeight = column.offsetHeight;
          const topStick = getTopStick();
          let shiftY = 0;

          if (!fitsInViewport(columnHeight, viewportHeight)) {
            if (resyncFromDom) {
              shiftY = clampShift(
                column.getBoundingClientRect().top - topStick,
                topStick,
                columnHeight,
                viewportHeight,
              );
            } else {
              shiftY = clampShift(
                getColumnShift(column),
                topStick,
                columnHeight,
                viewportHeight,
              );
            }
          }

          setColumnShift(column, shiftY);
          setColumnTop(column, topStick, shiftY);
        }

        function applyAllColumnShifts(viewportHeight, options) {
          stickyColumns.forEach((column) => {
            applyColumnShift(column, viewportHeight, options);
          });
        }

        function updateFromScroll() {
          scrollTicking = false;

          const scrollY = window.scrollY;
          const delta = scrollY - lastScrollY;
          lastScrollY = scrollY;

          const viewportHeight = window.innerHeight;
          const topStick = getTopStick();
          const layoutTop = layout.getBoundingClientRect().top;
          const beforeLayout = layoutTop > topStick + 1;

          stickyColumns.forEach((column) => {
            const columnHeight = column.offsetHeight;

            if (fitsInViewport(columnHeight, viewportHeight) || beforeLayout) {
              setColumnShift(column, 0);
              setColumnTop(column, topStick, 0);
              return;
            }

            const shiftY = clampShift(
              getColumnShift(column) - delta,
              topStick,
              columnHeight,
              viewportHeight,
            );
            setColumnShift(column, shiftY);
            setColumnTop(column, topStick, shiftY);
          });
        }

        function onScroll() {
          if (scrollTicking) {
            return;
          }
          scrollTicking = true;
          window.requestAnimationFrame(updateFromScroll);
        }

        function scheduleLayoutUpdate({ resyncFromDom = false } = {}) {
          window.clearTimeout(layoutTickTimer);
          layoutTickTimer = window.setTimeout(() => {
            window.requestAnimationFrame(() => {
              refreshNavOffset();
              refreshStickyColumns();
              applyAllColumnShifts(window.innerHeight, { resyncFromDom });
            });
          }, RESIZE_DEBOUNCE_MS);
        }

        window.updateAnalyzingStickyTop = function () {
          window.requestAnimationFrame(() => {
            refreshStickyColumns();
            applyAllColumnShifts(window.innerHeight);
          });
        };

        window.resetAnalyzingStickyShift = function () {
          lastScrollY = window.scrollY;
          refreshStickyColumns();
          stickyColumns.forEach((column) => {
            setColumnShift(column, 0);
          });
          window.requestAnimationFrame(() => {
            applyAllColumnShifts(window.innerHeight);
          });
        };

        refreshNavOffset();
        refreshStickyColumns();
        applyAllColumnShifts(window.innerHeight, { resyncFromDom: true });

        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", () => {
          lastScrollY = window.scrollY;
          scheduleLayoutUpdate({ resyncFromDom: true });
        });

        if (typeof ResizeObserver === "function") {
          const resizeObserver = new ResizeObserver(() => {
            scheduleLayoutUpdate();
          });
          resizeObserver.observe(layout);
        }
      })();
    </script>
  </body>
</html>
